<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Miguel Andrés</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;700;900&family=Playfair+Display:ital,wght@0,900;1,900&display=swap');

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

html,body{
  width:100%;height:100%;
  background:#02010a;
  font-family:'Inter',sans-serif;
  overflow:hidden;color:#fff;
}

/* ── animated RGB background ── */
.bg-aurora{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(ellipse 60% 50% at 20% 50%, rgba(255,0,128,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 50% at 80% 50%, rgba(0,200,255,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 50% 20%, rgba(120,0,255,0.15) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 50% 80%, rgba(0,255,150,0.10) 0%, transparent 60%);
  animation:aurora 12s ease-in-out infinite alternate;
}
@keyframes aurora{
  0%  {filter:hue-rotate(0deg)   brightness(1)}
  33% {filter:hue-rotate(60deg)  brightness(1.15)}
  66% {filter:hue-rotate(140deg) brightness(1.05)}
  100%{filter:hue-rotate(220deg) brightness(1.2)}
}

/* ── grid ── */
.grid{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);
  background-size:65px 65px;
}

/* ── canvas particles ── */
#cv{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ── vignette ── */
.vig{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(ellipse 100% 100% at 50% 50%,transparent 35%,rgba(2,1,10,0.88) 100%);
}

/* ── scanlines ── */
.scan{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 3px);
}

/* ── HUD corners ── */
.corner{position:fixed;width:72px;height:72px;z-index:10;pointer-events:none;opacity:0;animation:cfade 1s ease 2.4s forwards}
.c-tl{top:18px;left:18px}
.c-tr{top:18px;right:18px;transform:scaleX(-1)}
.c-bl{bottom:18px;left:18px;transform:scaleY(-1)}
.c-br{bottom:18px;right:18px;transform:scale(-1)}
@keyframes cfade{to{opacity:.6}}

/* ── top status bar ── */
.topbar{
  position:fixed;top:18px;left:50%;transform:translateX(-50%);
  z-index:20;font-size:9px;letter-spacing:.4em;text-transform:uppercase;
  color:rgba(255,255,255,.3);font-weight:200;
  opacity:0;animation:fadeUp .8s ease 2.8s forwards;white-space:nowrap;
  display:flex;align-items:center;gap:10px;
}
.topbar-dot{width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff;animation:blink 2s infinite}

/* ── stage ── */
.stage{
  position:relative;z-index:10;
  width:100%;height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}

/* ── ORB ── */
.orb-wrap{
  position:relative;width:140px;height:140px;margin-bottom:48px;
  opacity:0;transform:scale(.4);
  animation:orbIn 1.3s cubic-bezier(.16,1,.3,1) .1s forwards;
}
@keyframes orbIn{to{opacity:1;transform:scale(1)}}

.orb{
  width:140px;height:140px;border-radius:50%;
  background:conic-gradient(from 0deg,#ff0080,#ff6600,#ffff00,#00ff88,#00cfff,#8000ff,#ff0080);
  box-shadow:
    0 0 50px rgba(180,0,255,0.7),
    0 0 100px rgba(0,200,255,0.4),
    0 0 180px rgba(255,0,128,0.25),
    inset 0 0 40px rgba(0,0,0,0.6);
  animation:orbSpin 8s linear infinite, orbPulse 4s ease-in-out infinite, orbFloat 7s ease-in-out infinite;
  display:flex;align-items:center;justify-content:center;
  position:relative;overflow:hidden;
}
.orb::after{
  content:'';position:absolute;inset:8px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.25),#05030f 65%);
}
.orb-icon{
  position:relative;z-index:2;
  font-size:42px;filter:drop-shadow(0 0 12px rgba(255,255,255,.8));
}
@keyframes orbSpin{to{filter:hue-rotate(360deg)}}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes orbPulse{
  0%,100%{box-shadow:0 0 50px rgba(180,0,255,.7),0 0 100px rgba(0,200,255,.4),0 0 180px rgba(255,0,128,.25),inset 0 0 40px rgba(0,0,0,.6)}
  50%{box-shadow:0 0 80px rgba(180,0,255,.9),0 0 160px rgba(0,200,255,.6),0 0 260px rgba(255,0,128,.35),inset 0 0 50px rgba(0,0,0,.5)}
}

/* rings */
.ring{position:absolute;border-radius:50%;border:1px solid transparent}
.r1{
  inset:-20px;
  border-color:rgba(255,255,255,.15);
  animation:rr 10s linear infinite;
}
.r1::before{content:'';position:absolute;top:-4px;left:50%;transform:translateX(-50%);width:9px;height:9px;border-radius:50%;background:#00cfff;box-shadow:0 0 16px #00cfff,0 0 8px #fff}
.r2{
  inset:-38px;
  border-color:rgba(255,255,255,.07);
  animation:rr 18s linear infinite reverse;
}
.r2::after{content:'';position:absolute;bottom:-4px;right:20%;width:6px;height:6px;border-radius:50%;background:#ff0080;box-shadow:0 0 12px #ff0080}
.r3{
  inset:-58px;
  border-color:rgba(255,255,255,.04);
  border-style:dashed;
  animation:rr 30s linear infinite;
}
@keyframes rr{to{transform:rotate(360deg)}}

/* ── NAME ── */
.name-block{
  text-align:center;
  opacity:0;transform:translateY(30px);
  animation:fadeUp 1s cubic-bezier(.16,1,.3,1) .75s forwards;
}
.pre-label{
  font-size:10px;letter-spacing:.5em;text-transform:uppercase;
  color:rgba(255,255,255,.25);font-weight:200;margin-bottom:12px;
}
.name-main{
  font-family:'Playfair Display',serif;
  font-size:clamp(42px,9vw,86px);
  font-weight:900;font-style:italic;
  letter-spacing:-.01em;line-height:1;
  background:linear-gradient(135deg,#ffffff 0%,#a0f0ff 25%,#ff80e0 55%,#ffe066 80%,#80ffcc 100%);
  background-size:300% 300%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  animation:nameShift 8s ease-in-out infinite;
  text-shadow:none;
}
@keyframes nameShift{
  0%,100%{background-position:0% 50%}
  50%{background-position:100% 50%}
}

/* ── divider ── */
.divider{
  display:flex;align-items:center;gap:16px;
  margin:28px 0 24px;
  opacity:0;animation:fadeUp .8s ease 1.3s forwards;
}
.dl{height:1px;width:90px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2),transparent)}
.dd{
  width:8px;height:8px;transform:rotate(45deg);
  background:linear-gradient(135deg,#00cfff,#ff0080);
  box-shadow:0 0 14px rgba(0,200,255,.8),0 0 7px rgba(255,0,128,.6);
  flex-shrink:0;
}

/* ── status area ── */
.status-wrap{
  display:flex;flex-direction:column;align-items:center;gap:20px;
  opacity:0;animation:fadeUp .8s ease 1.6s forwards;
}
.status-row{
  display:flex;align-items:center;gap:10px;
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(255,255,255,.35);
}
.dot{
  width:7px;height:7px;border-radius:50%;
  background:linear-gradient(135deg,#00cfff,#ff0080);
  box-shadow:0 0 10px #00cfff;
  animation:blink 1.8s ease-in-out infinite;
}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.6)}}

/* ── RGB progress bar ── */
.track{
  width:min(320px,78vw);height:3px;
  background:rgba(255,255,255,.06);border-radius:99px;
  position:relative;
}
.fill{
  height:100%;border-radius:99px;
  background:linear-gradient(90deg,#ff0080,#ff6600,#ffff00,#00ff88,#00cfff,#8000ff);
  background-size:300% 100%;
  box-shadow:0 0 18px rgba(0,200,255,.6),0 0 36px rgba(255,0,128,.3);
  width:0%;
  animation:pfill 3.8s cubic-bezier(.4,0,.2,1) 2s forwards, barShift 3s linear 2s infinite;
  position:relative;
}
.fill::after{
  content:'';position:absolute;right:-2px;top:50%;transform:translateY(-50%);
  width:10px;height:10px;border-radius:50%;
  background:#fff;
  box-shadow:0 0 16px #fff,0 0 8px #00cfff,0 0 24px #ff0080;
}
@keyframes pfill{0%{width:0%}25%{width:30%}55%{width:60%}80%{width:83%}100%{width:100%}}
@keyframes barShift{to{background-position:-300% 0}}

.counter{
  font-size:10px;letter-spacing:.12em;
  color:rgba(255,255,255,.25);
  font-variant-numeric:tabular-nums;
}
.counter b{color:rgba(180,220,255,.7);font-weight:300}

/* ── shared ── */
@keyframes fadeUp{to{opacity:1;transform:translateY(0)}}

/* ── flash ── */
.flash{
  position:fixed;inset:0;z-index:999;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,#ffffff,#a0f0ff);
  transition:opacity .5s ease;
}
.flash.go{opacity:1}
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div class="bg-aurora"></div>
<div class="grid"></div>
<div class="vig"></div>
<div class="scan"></div>

<!-- HUD corners -->
<div class="corner c-tl">
  <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
    <path d="M4 68 L4 4 L68 4" stroke="url(#gc1)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="4" cy="4" r="4" fill="url(#gc1)"/>
    <defs><linearGradient id="gc1" x1="0" y1="0" x2="68" y2="68" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00cfff"/><stop offset="100%" stop-color="#ff0080"/></linearGradient></defs>
  </svg>
</div>
<div class="corner c-tr">
  <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
    <path d="M4 68 L4 4 L68 4" stroke="url(#gc2)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="4" cy="4" r="4" fill="url(#gc2)"/>
    <defs><linearGradient id="gc2" x1="0" y1="0" x2="68" y2="68" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#ff0080"/><stop offset="100%" stop-color="#ffff00"/></linearGradient></defs>
  </svg>
</div>
<div class="corner c-bl">
  <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
    <path d="M4 68 L4 4 L68 4" stroke="url(#gc3)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="4" cy="4" r="4" fill="url(#gc3)"/>
    <defs><linearGradient id="gc3" x1="0" y1="0" x2="68" y2="68" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#00ff88"/><stop offset="100%" stop-color="#00cfff"/></linearGradient></defs>
  </svg>
</div>
<div class="corner c-br">
  <svg width="72" height="72" viewBox="0 0 72 72" fill="none">
    <path d="M4 68 L4 4 L68 4" stroke="url(#gc4)" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="4" cy="4" r="4" fill="url(#gc4)"/>
    <defs><linearGradient id="gc4" x1="0" y1="0" x2="68" y2="68" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#8000ff"/><stop offset="100%" stop-color="#ff0080"/></linearGradient></defs>
  </svg>
</div>

<!-- top bar -->
<div class="topbar">
  <div class="topbar-dot"></div>
  Direct Access Protocol · Active
  <div class="topbar-dot"></div>
</div>

<div class="stage">

  <div class="orb-wrap">
    <div class="ring r3"></div>
    <div class="ring r2"></div>
    <div class="ring r1"></div>
    <div class="orb">
      <div class="orb-icon">▶</div>
    </div>
  </div>

  <div class="name-block">
    <div class="pre-label">Welcome to the realm of</div>
    <div class="name-main">Miguel Andrés</div>
  </div>

  <div class="divider">
    <div class="dl"></div>
    <div class="dd"></div>
    <div class="dl"></div>
  </div>

  <div class="status-wrap">
    <div class="status-row">
      <div class="dot"></div>
      <span id="msg">Initializing secure connection</span>
    </div>
    <div class="track">
      <div class="fill"></div>
    </div>
    <div class="counter">Redirecting in <b id="cd">4</b> seconds</div>
  </div>

</div>

<div class="flash" id="flash"></div>

<script>
const TARGET = 'https://www.youtube.com/watch?v=UZw7y0-txpI';

/* ── RGB particles ── */
const cv = document.getElementById('cv');
const cx = cv.getContext('2d');
let W, H, pts = [];

function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight}
resize();
window.addEventListener('resize',()=>{resize();spawn()});

function spawn(){
  pts=[];
  const n=Math.floor(W*H/7000);
  const hues=[0,30,60,120,180,240,280,320];
  for(let i=0;i<n;i++){
    pts.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*2+.3,
      vx:(Math.random()-.5)*.3,
      vy:-Math.random()*.55-.08,
      a:Math.random()*.6+.1,
      life:Math.random(),
      ml:Math.random()*.6+.5,
      hue:hues[Math.floor(Math.random()*hues.length)]
    });
  }
}
spawn();

function draw(){
  cx.clearRect(0,0,W,H);
  pts.forEach(p=>{
    p.life+=.002;
    if(p.life>p.ml){p.x=Math.random()*W;p.y=H+10;p.life=0}
    p.x+=p.vx;p.y+=p.vy;
    const a=Math.sin(p.life/p.ml*Math.PI)*p.a;
    cx.beginPath();cx.arc(p.x,p.y,p.r,0,Math.PI*2);
    cx.fillStyle=`hsla(${p.hue},100%,65%,${a})`;
    cx.fill();
  });
  requestAnimationFrame(draw);
}
draw();

/* ── messages ── */
const msgs=[
  'Initializing secure connection',
  'Verifying access credentials',
  'Loading destination portal',
  'Preparing your experience'
];
const el=document.getElementById('msg');
let mi=0;
setInterval(()=>{
  mi=(mi+1)%msgs.length;
  el.style.transition='opacity .3s';
  el.style.opacity=0;
  setTimeout(()=>{el.textContent=msgs[mi];el.style.opacity=1},330);
},1050);

/* ── countdown ── */
const cdEl=document.getElementById('cd');
let t=4;
const iv=setInterval(()=>{
  t--;cdEl.textContent=t;
  if(t<=0){
    clearInterval(iv);
    document.getElementById('flash').classList.add('go');
    setTimeout(()=>location.href=TARGET,550);
  }
},1000);
</script>
</body>
</html>
