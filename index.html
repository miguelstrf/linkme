<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mike</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(-45deg,#0f172a,#1e293b,#111827,#020617);
    background-size:400% 400%;
    animation:bg 8s ease infinite;
    font-family:Arial,sans-serif;
    color:white;
    overflow:hidden;
}

@keyframes bg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.card{
    text-align:center;
    background:rgba(255,255,255,0.08);
    padding:40px;
    border-radius:25px;
    backdrop-filter:blur(10px);
    box-shadow:0 0 40px rgba(0,0,0,.4);
}

h1{
    font-size:4rem;
    margin-bottom:15px;
}

.loader{
    width:70px;
    height:70px;
    border:6px solid rgba(255,255,255,.15);
    border-top:6px solid white;
    border-radius:50%;
    margin:20px auto;
    animation:spin 1s linear infinite;
}

@keyframes spin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

p{
    opacity:.8;
    margin-top:10px;
}

.count{
    font-size:1.2rem;
    margin-top:15px;
}
</style>
</head>

<body>

<div class="card">
    <h1>Mike</h1>

    <div class="loader"></div>

    <p>Verificando acceso...</p>

    <div class="count">
        Redirigiendo en <span id="timer">4</span>
    </div>
</div>

<script>
const destino = "https://www.youtube.com/watch?v=UZw7y0-txpI";

let tiempo = 4;

const intervalo = setInterval(() => {
    tiempo--;
    document.getElementById("timer").textContent = tiempo;

    if(tiempo <= 0){
        clearInterval(intervalo);
        window.location.href = destino;
    }
}, 1000);
</script>

</body>
</html>
